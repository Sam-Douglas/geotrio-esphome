# Paste this at the end of the YAML that ESPHome Device Builder generated for your device.
# Keep everything Device Builder generated (esphome, esp32, logger, api, ota, wifi, captive_portal).

# Seeed Studio XIAO ESP32-C6 only. Its antenna switch needs GPIO3 low to power it and GPIO14 low to
# select the built-in antenna; without this the WiFi signal is very weak. Remove for other boards.
switch:
  - platform: gpio
    id: antenna_switch_power
    pin: GPIO3
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: antenna_select_external
    pin: GPIO14
    restore_mode: ALWAYS_OFF
    internal: true

external_components:
  - source: github://Sam-Douglas/geotrio-esphome@v0.1.0
    components: [geotrio]

# Display J8 TX pad -> XIAO D10 (GPIO18). Listen only: never add a tx_pin.
uart:
  rx_pin:
    number: GPIO18
    # Holds the pin at the line's resting level so an unconnected pin doesn't read noise as data.
    mode:
      input: true
      pullup: true
  baud_rate: 115200
  # Room for about 90 ms of meter data in case WiFi briefly keeps the processor busy.
  rx_buffer_size: 1024

geotrio:
  # Logs every meter message as hex. Useful while setting up; set to false once it all works.
  log_frames: true

binary_sensor:
  - platform: geotrio
    meter_connection:
      name: "Meter connection"

sensor:
  - platform: geotrio
    electricity_power:
      name: "Electricity power"
    electricity_meter:
      name: "Electricity meter"
    electricity_usage_today:
      name: "Electricity usage today"
    electricity_usage_this_week:
      name: "Electricity usage this week"
    electricity_usage_this_month:
      name: "Electricity usage this month"
    electricity_cost_today:
      name: "Electricity cost today"
    electricity_cost_this_week:
      name: "Electricity cost this week"
    electricity_cost_this_month:
      name: "Electricity cost this month"
    electricity_unit_rate:
      name: "Electricity unit rate"
    electricity_standing_charge:
      name: "Electricity standing charge"
    gas_meter:
      name: "Gas meter"
    gas_usage_today:
      name: "Gas usage today"
    gas_usage_this_week:
      name: "Gas usage this week"
    gas_usage_this_month:
      name: "Gas usage this month"
    gas_cost_today:
      name: "Gas cost today"
    gas_cost_this_week:
      name: "Gas cost this week"
    gas_cost_this_month:
      name: "Gas cost this month"
    gas_unit_rate:
      name: "Gas unit rate"
    gas_unit_rate_per_cubic_metre:
      name: "Gas unit rate per m³"
    gas_standing_charge:
      name: "Gas standing charge"
    gas_calorific_value:
      name: "Gas calorific value"
    gas_volume_correction:
      name: "Gas volume correction"
